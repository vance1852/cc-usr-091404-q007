[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "potency-review"
version = "0.1.0"
description = "细胞法效价检测会审系统：4PL 拟合、规则判定、复测会审与全程追溯"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
include = ["potency*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
